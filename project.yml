name: Fern
options:
  bundleIdPrefix: garden.fern
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_NSFaceIDUsageDescription: "Fern uses Face ID to keep your private writing for your eyes only."
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Fern can note where an entry was written, if you choose to add a place."
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Fern adds the photos you choose to your entries."
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Fern can save images to your photo library."
    INFOPLIST_KEY_UIFileSharingEnabled: YES
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
packages:
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown
    from: "0.5.0"
targets:
  Fern:
    type: application
    platform: iOS
    sources: [Fern]
    dependencies:
      - package: swift-markdown
        product: Markdown
    entitlements:
      path: Fern/Fern.entitlements
      properties:
        com.apple.developer.weatherkit: true
        # CloudKit & Journaling Suggestions do NOT auto-provision via
        # -allowProvisioningUpdates. Enable each in Xcode (target Fern →
        # Signing & Capabilities → + Capability):
        #   • iCloud → check CloudKit → add container "iCloud.garden.fern.Fern"
        #     (then re-add the two icloud-* entitlements here; the container
        #      uses .automatic in Persistence.swift, so sync turns on with no
        #      code change)
        #   • Journaling Suggestions (then re-add com.apple.developer.journal.allow
        #     and the SuggestionsButton in TodayView)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: garden.fern.Fern
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 775QLS4P2V
        CODE_SIGN_STYLE: Automatic
  FernTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FernTests]
    dependencies:
      - target: Fern
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: garden.fern.FernTests
schemes:
  Fern:
    build:
      targets:
        Fern: all
        FernTests: [test]
    test:
      targets: [FernTests]
