name: Fern
options:
  bundleIdPrefix: garden.fern
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_NSFaceIDUsageDescription: "Fern uses Face ID to keep your private writing for your eyes only."
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Fern can note where an entry was written, if you choose to add a place."
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Fern adds the photos you choose to your entries."
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Fern can save images to your photo library."
    INFOPLIST_KEY_UIFileSharingEnabled: YES
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
packages:
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown
    from: "0.5.0"
targets:
  Fern:
    type: application
    platform: iOS
    sources: [Fern]
    dependencies:
      - package: swift-markdown
        product: Markdown
      - target: FernWidget
    entitlements:
      path: Fern/Fern.entitlements
      properties:
        com.apple.developer.weatherkit: true
        # iCloud / CloudKit sync. SwiftData's .automatic mode picks up this
        # container. Needs the portal side: App ID garden.fern.Fern with
        # iCloud+CloudKit and Push Notifications enabled, and the container made.
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.garden.fern.Fern]
        # CloudKit syncs via silent pushes. "development" for Xcode/dev builds;
        # switch to "production" for TestFlight / App Store.
        aps-environment: development
        # Journaling Suggestions (com.apple.developer.journal.allow) stays
        # deferred — a MANAGED capability needing an Apple Capability Request.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: garden.fern.Fern
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 775QLS4P2V
        CODE_SIGN_STYLE: Automatic
        # Partial Info.plist (UIBackgroundModes: remote-notification for background
        # CloudKit sync) merged with the generated INFOPLIST_KEY_* values above.
        INFOPLIST_FILE: Fern/Info.plist
  FernTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FernTests]
    dependencies:
      - target: Fern
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: garden.fern.FernTests
  FernWidget:
    type: app-extension
    platform: iOS
    sources:
      - FernWidget
      - Fern/Models/Prompt.swift
      - Fern/Store/PromptLibrary.swift
      - Fern/Content
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: garden.fern.Fern.FernWidget
        DEVELOPMENT_TEAM: 775QLS4P2V
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FernWidget/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  Fern:
    build:
      targets:
        Fern: all
        FernTests: [test]
    test:
      targets: [FernTests]
